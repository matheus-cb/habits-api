name: quality-gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # AGENTS.md é canônico e o CLAUDE.md só o importa. Sem este gate a convenção é
  # texto: uma regra escrita no arquivo errado fica invisível para o Codex, e uma
  # invariante sem teste que a cite fica invisível para todo mundo.
  agent-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-agent-docs.sh

  # Camada 1 — sem dependência externa. É o gate que qualquer máquina reproduz.
  camada-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # tsup NÃO checa tipo. Sem este passo, `npm run build` passa verde com
      # doze erros de tipo — foi o que aconteceu por dois anos aqui.
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit

  # Camada 2 — exige PostgreSQL. Roda no CI mesmo quando a estação de trabalho
  # está sem Docker: é aqui que a constraint única e o 401 são realmente provados.
  camada-2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Criado direto com o nome de teste: o serviço nasce só para o CI.
          POSTGRES_DB: habits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # O nome termina em `_test` porque `tests/setup.ts` recusa apagar tabelas em
      # qualquer outro banco. O `.env.test` do repositório aponta para o mesmo
      # nome, então CI e estação de trabalho rodam contra a mesma coisa.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/habits_test?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      NODE_ENV: test
      # Nenhuma chave de IA: a suíte de integração roda no caminho
      # determinístico de propósito (INV-15). Se um teste passar a exigir chave,
      # ele quebra aqui — e é o que se quer.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      # O banco shadow existe só para o `migrate diff` aplicar as migrações e
      # comparar com o schema.prisma. Nunca recebe dado de teste.
      - name: Criar banco shadow
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE habits_shadow'
      # Fecha a classe que a checagem 8 do gate não alcança: migração rastreada
      # mas DESATUALIZADA. Um schema.prisma editado sem migração deixa o clone
      # subir com o esquema antigo, e o erro só aparece na primeira query que
      # toca a coluna ausente.
      - name: Drift de esquema
        env:
          DATABASE_URL_SHADOW: postgresql://postgres:postgres@localhost:5432/habits_shadow?schema=public
        run: ./scripts/check-schema-drift.sh
      - run: npm run test:integration
      # A mesma suíte num fuso 17h à frente do de desenvolvimento. O servidor
      # resolve o dia em UTC (INV-04) e testes com data relativa poderiam herdar a
      # convenção local que o servidor abandonou. Ver o comentário no verify.sh.
      - run: npm run test:integration:tz

  build:
    runs-on: ubuntu-latest
    needs: [camada-1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  # Camada 3 — sobe a stack e bate nela por HTTP.
  #
  # É a única coisa no gate que prova que a IMAGEM funciona. O Dockerfile deste
  # repositório produzia um container em loop de reinício (engine do Prisma
  # incompatível com o OpenSSL da Alpine) e nada percebia, porque nada subia a
  # stack. Também é onde "funciona sem chave de IA" deixa de ser afirmação sobre
  # um dublê e passa a ser fato sobre um processo real.
  smoke:
    runs-on: ubuntu-latest
    needs: [camada-1]
    env:
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      # Ausente de propósito. A stack tem de subir e responder sem provedor de
      # IA (INV-15), e o smoke verifica `narration.source = deterministic`.
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v4

      - run: docker compose config --quiet

      - name: Subir a stack
        # `--wait` só funciona porque os dois serviços têm healthcheck; sem eles,
        # `depends_on` espera o container existir, não estar pronto.
        run: docker compose up --detach --build --wait

      # O smoke vive em scripts/smoke.sh, e não embutido neste YAML, para haver
      # UMA cópia — rodável aqui e na estação de trabalho, sem duas versões
      # divergindo em silêncio.
      - name: Smoke HTTP
        run: ./scripts/smoke.sh

      - name: Logs dos containers em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Derrubar a stack
        if: always()
        run: docker compose down --volumes --remove-orphans
