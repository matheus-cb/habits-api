# `version:` foi removido: é obsoleto no Compose v2 e só gera aviso.
#
# Identidade e portas são parametrizadas com `${VAR:-default}`, que o Compose
# interpola nativamente. Sem nenhuma variável definida o comportamento é byte a
# byte o de antes — `habits-postgres`, `habits-api`, 5432, 3333 — então
# `npm run docker:up` e o `docker exec` por nome do `db:test:create` não mudam.
#
# Existe para a Camada 3.5 (`scripts/verify-repro.sh`) poder subir uma segunda
# stack em paralelo sem colidir. A versão anterior editava este arquivo por `sed`
# no clone, e isso tinha dois problemas: `sed` sobre YAML quebra em qualquer
# reformatação válida (um comentário entre a chave `ports:` e o item já derrotava
# o padrão), e — pior — a camada que existe para testar o repositório mexia no
# repositório antes de testá-lo. Parametrizar move a variabilidade para o arquivo
# versionado, e o clone a herda.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${STACK_PREFIX:-habits}-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: habits
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem healthcheck, `depends_on` só espera o container EXISTIR, não o Postgres
    # aceitar conexão — e `docker compose up --wait` não tem o que aguardar.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d habits']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - habits-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${STACK_PREFIX:-habits}-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-3333}:3333'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/habits?schema=public
      # A conexão da primitiva `query` do MCP. A role e o RLS nascem de uma
      # migração, então ela existe no banco desde o `migrate deploy` do entrypoint
      # — mas sem esta variável a primitiva simplesmente NÃO É REGISTRADA, e o
      # sintoma é `Tool query not found`, não erro de conexão. Foi o smoke da
      # Camada 3 que pegou: nenhuma outra camada olha a imagem.
      DATABASE_URL_READONLY: postgresql://habits_readonly:habits_readonly_dev@postgres:5432/habits?schema=public
      # O default anterior tinha 25 caracteres e o Zod exige 32: mesmo com o
      # engine do Prisma correto, a API se recusava a subir. Um default que não
      # passa na própria validação é pior do que nenhum default.
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET com no minimo 32 caracteres}
      JWT_EXPIRES_IN: 7d
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Deliberadamente repassada vazia quando ausente: a stack tem de subir e
      # funcionar sem provedor de IA (INV-15), e o smoke verifica isso.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-sonnet-5}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-90}
      # Os tetos do assistente conversacional.
      #
      # Sem estas linhas o container caía nos defaults do Zod e os valores do
      # `.env` eram IGNORADOS na imagem — quem apertasse o teto diário para conter
      # custo veria o número no arquivo e o comportamento antigo no container, sem
      # nada acusando. Os defaults aqui repetem os do Zod de propósito: se alguém
      # remover a variável do `.env`, o comportamento não muda.
      ASSISTANT_DAILY_OUTPUT_TOKENS: ${ASSISTANT_DAILY_OUTPUT_TOKENS:-120000}
      ASSISTANT_MAX_TURNS: ${ASSISTANT_MAX_TURNS:-10}
      ASSISTANT_ACTION_TTL_MINUTES: ${ASSISTANT_ACTION_TTL_MINUTES:-30}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1024}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      ASSISTANT_DAILY_COST_USD: ${ASSISTANT_DAILY_COST_USD:-3}
      ASSISTANT_CLI_TIMEOUT_MS: ${ASSISTANT_CLI_TIMEOUT_MS:-120000}
      # `CLAUDE_CLI_PATH` NÃO tem default, e a ausência é a informação: o CLI do
      # Claude Code não existe na imagem e não pode existir — a credencial dele
      # vive no keychain de quem instalou. Passar a variável é intencional para o
      # caso de alguém montar o binário e o `HOME` no container; vazia, o motor CLI
      # simplesmente não é escolhido e a chave da API atende.
      CLAUDE_CLI_PATH: ${CLAUDE_CLI_PATH:-}
      # `CORS_ORIGIN` faltava desde antes do assistente, e o efeito é visível: o
      # dashboard servido de outra origem seria bloqueado pelo navegador e o
      # container não tinha como saber qual origem liberar. Achado pelo gate de
      # INV-37, que foi escrito para outro defeito.
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - habits-network
    # Sem montar ./src nem ./prisma: a imagem de produção roda `dist/`, e montar
    # o TypeScript por cima só sombreava o conteúdo construído sem efeito nenhum.

volumes:
  postgres_data:

networks:
  habits-network:
    driver: bridge
